<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everyday Materials Adventure</title>
<meta name="description" content="Year 1 Science – Everyday Materials. An interactive, gamified science adventure for 6–7 year olds.">
<!-- Optional font. If offline, the lesson falls back to system fonts automatically. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME TOKENS
   ========================================================= */
:root{
  --ink:#2b2350; --muted:#6b6590; --bg:#eef7ff; --card:#ffffff; --line:#e3e0f5;
  --primary:#6c4cf5; --primary-d:#5536d8; --orange:#ff8a3d; --yellow:#ffd23f;
  --green:#1fa968; --green-bg:#e3f9ee; --try:#f08a24; --try-bg:#fff1e3;
  --blue:#3fa9f5; --pink:#ff5fa2; --radius:22px;
  --shadow:0 8px 24px rgba(60,40,140,.12); --shadow-s:0 4px 12px rgba(60,40,140,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:var(--ink); background:var(--bg); font-size:20px; line-height:1.4; min-height:100vh;
  background-image:
    radial-gradient(circle at 8% 22%, #fff3c4 0 110px, transparent 111px),
    radial-gradient(circle at 94% 78%, #e4dbff 0 150px, transparent 151px),
    radial-gradient(circle at 70% 8%, #d6f5e6 0 70px, transparent 71px);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:.4em 0}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:100%;height:100%;display:block;overflow:visible}
.ico-s{display:block;flex:0 0 auto}
.ico-s > .matc{width:100%;height:100%;border-radius:30%;border-width:2px}
.title:focus{outline:none}

/* =========================================================
   HUD (top bar) + NAV (bottom bar)
   ========================================================= */
.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand-m{width:44px;height:50px}
.brand-t{font-weight:700;font-size:17px;line-height:1.1;color:var(--primary)}
.brand-t small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.prog{flex:1;min-width:80px}
.prog-bar{position:relative;height:16px;background:#ece9fb;border-radius:20px;overflow:visible}
.prog-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--primary));transition:width .6s ease}
.prog-bar span{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:24px;transition:left .6s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.prog small{display:block;color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-btns{display:flex;gap:6px;align-items:center}
.hud-chip{border:0;background:#fff7d6;border-radius:30px;padding:6px 12px;font-weight:700;font-size:18px;box-shadow:var(--shadow-s)}
.icon-btn{border:0;background:#f1eefe;border-radius:50%;width:40px;height:40px;font-size:18px;display:grid;place-items:center}
.icon-btn[aria-pressed="false"]{opacity:.45}
.hud-chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

main{max-width:1000px;margin:0 auto;padding:16px 16px 120px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:3px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:18px;display:grid;place-items:center;padding:0}
.dot.cur{border-color:var(--primary);background:#efeaff;transform:scale(1.1)}
.dot.done{border-color:var(--green);background:var(--green-bg)}
.dot:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(1)}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{border:0;border-radius:18px;padding:12px 22px;font-weight:600;font-size:20px;background:#fff;box-shadow:0 4px 0 #d9d4f2;transition:transform .1s, box-shadow .1s;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9d4f2}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 5px 0 var(--primary-d)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 5px 0 #138552}
.btn.orange{background:var(--orange);color:#fff;box-shadow:0 5px 0 #d96a20}
.btn.ghost{background:#f1eefe;box-shadow:0 4px 0 #dcd5fb}
.btn.big{font-size:24px;padding:16px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.locked{background:#cfc9ea;box-shadow:0 5px 0 #b3abd8}
.btn.pulse{animation:pulse 1.2s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 5px 0 var(--primary-d),0 0 0 10px rgba(108,76,245,.18)}}
.row-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}

/* =========================================================
   STEP LAYOUT
   ========================================================= */
.step{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:22px 22px 26px;animation:stepIn .45s ease;border:3px solid #fff}
@keyframes stepIn{from{opacity:0;transform:translateY(16px)}}
.step-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--c,#6c4cf5);color:#fff;font-weight:600;font-size:15px;padding:4px 12px;border-radius:30px}
.pill.soft{background:#f1eefe;color:var(--primary)}
.title{font-size:clamp(28px,5vw,40px);color:var(--ink);margin:4px 0 12px}
.guide{display:flex;gap:12px;align-items:flex-end;margin:6px 0 18px}
.g-mascot{width:74px;height:86px;flex:0 0 auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:#f4f1ff;border:3px solid #e1dafc;border-radius:22px 22px 22px 6px;padding:12px 54px 12px 16px;font-size:21px;flex:1}
.bubble .read{position:absolute;right:8px;top:8px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;box-shadow:var(--shadow-s)}
.body{display:block}
.center{text-align:center}
.inst{font-size:19px;color:var(--muted);text-align:center;margin:6px 0 14px}
.card{background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:16px}
.soft-card{background:#f8f6ff;border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(var(--min,150px),1fr))}
.hero-pic{width:min(240px,60vw);height:min(240px,60vw);margin:0 auto 10px;padding:14px;background:radial-gradient(circle,#fffbe6 0 60%,transparent 61%);}
.hero-pic.sm{width:150px;height:150px}
.big-say{font-size:clamp(22px,4vw,30px);text-align:center;font-weight:500;margin:10px 0}
.tag{display:inline-block;padding:0 10px;border-radius:10px;color:#fff}
.tag.obj{background:var(--orange)} .tag.mat{background:var(--green)}
.note{background:#fffbe6;border:3px dashed #ffd76a;border-radius:18px;padding:12px 16px;margin:14px 0;font-size:19px}
.safety{background:#fff0f0;border:3px solid #ffc2c2;border-radius:18px;padding:12px 16px;margin:12px 0;font-size:18px}
.pop-in{animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.wiggle{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* Teacher's help */
.teach{margin-top:22px;border:2px dashed #cfc7f3;border-radius:18px;background:#fbfaff;font-size:17px}
.teach summary{cursor:pointer;padding:10px 16px;font-weight:600;color:var(--primary);list-style:none}
.teach summary::-webkit-details-marker{display:none}
.teach summary::before{content:'▸ ';}
.teach[open] summary::before{content:'▾ ';}
.teach .tb{padding:0 16px 14px}
.teach dt{font-weight:700;margin-top:8px}
.teach dd{margin:2px 0 0 0}

/* =========================================================
   MATERIAL CHARACTERS + SWATCHES
   ========================================================= */
.matc{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:24px;border:3px solid #3d3040;position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08);flex:0 0 auto;vertical-align:middle}
.matc.sm{width:42px;height:42px;border-radius:14px;border-width:2px;box-shadow:inset -3px -4px 0 rgba(0,0,0,.08)}
.matc.lg{width:112px;height:112px;border-radius:36px}
.matc .face{position:relative;width:58%;height:38%}
.matc .face i{position:absolute;top:0;width:20%;aspect-ratio:1;background:#3d3040;border-radius:50%}
.matc .face i:first-child{left:12%} .matc .face i:nth-child(2){right:12%}
.matc .face b{position:absolute;left:30%;right:30%;bottom:0;height:42%;border:3px solid #3d3040;border-top:0;border-radius:0 0 40px 40px}
.matc.sm .face b{border-width:2px}
.sw-wood{background:repeating-linear-gradient(100deg,#c98a4b 0 7px,#b8763a 7px 10px,#d39a5c 10px 17px)}
.sw-plastic{background:radial-gradient(circle at 28% 25%,rgba(255,255,255,.75) 0 12%,transparent 13%),linear-gradient(135deg,#ff6b6b,#ff9f43)}
.sw-metal{background:linear-gradient(135deg,#eef1f5,#9aa6b2 42%,#f7f8fa 52%,#8b96a3)}
.sw-glass{background:linear-gradient(125deg,rgba(255,255,255,.9) 0 16%,rgba(185,228,255,.75) 16% 34%,rgba(255,255,255,.85) 34% 40%,rgba(165,215,248,.7) 40%)}
.sw-fabric{background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,#6c7cf5 0 4px,#8a97ff 4px 8px)}
.sw-rock{background:radial-gradient(circle at 22% 30%,#74777d 0 5%,transparent 6%),radial-gradient(circle at 70% 62%,#b8bbc0 0 9%,transparent 10%),radial-gradient(circle at 42% 80%,#7d8086 0 4%,transparent 5%),radial-gradient(circle at 80% 22%,#85888e 0 5%,transparent 6%),#9b9ea3}
.sw-sponge{background:radial-gradient(circle at 30% 30%,#e8b800 0 6%,transparent 7%),radial-gradient(circle at 70% 55%,#e8b800 0 7%,transparent 8%),radial-gradient(circle at 40% 75%,#e8b800 0 5%,transparent 6%),#ffd23f}
.sw-rubber{background:radial-gradient(circle at 28% 25%,rgba(255,255,255,.4) 0 10%,transparent 11%),#e0892c}
.sw-paper{background:repeating-linear-gradient(0deg,#fff 0 10px,#dbe9ff 10px 12px)}
.sw-card{background:repeating-linear-gradient(90deg,#d6a46a 0 9px,#c99357 9px 11px)}

/* =========================================================
   WELCOME
   ========================================================= */
.welcome{text-align:center;padding:10px 0}
.welcome .w-mascot{width:150px;height:175px;margin:0 auto;animation:bob 3s ease-in-out infinite}
.welcome h1{font-size:clamp(32px,6vw,52px);color:var(--primary);margin:8px 0}
.welcome .sub{font-size:22px;color:var(--muted)}
.lab-shelf{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.lab-shelf .matc{animation:bob 2.6s ease-in-out infinite}
.lab-shelf .matc:nth-child(2n){animation-delay:.4s}.lab-shelf .matc:nth-child(3n){animation-delay:.8s}
.name-box{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px 0}
.name-box input{font-size:24px;padding:12px 18px;border-radius:18px;border:3px solid var(--line);text-align:center;width:min(340px,100%)}
.name-box input:focus{outline:none;border-color:var(--primary)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.map div{background:#f8f6ff;border-radius:18px;padding:10px;font-size:16px}
.map b{display:block;font-size:28px}

/* =========================================================
   MULTIPLE CHOICE
   ========================================================= */
.q{font-size:24px;font-weight:600;text-align:center;margin:8px 0 12px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:4px solid var(--line);background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:21px;font-weight:600;box-shadow:0 5px 0 #e6e2f7;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:#c9bdf9}
.opt-pic{width:84px;height:84px;display:grid;place-items:center}
.opt-pic .matc{width:72px;height:72px}
.opt.right{border-color:var(--green);background:var(--green-bg);animation:popIn .4s}
.opt.wrong{border-color:var(--try);background:var(--try-bg);animation:shake .45s}
.opt:disabled{cursor:default}
.opt.wrong:disabled{opacity:.7}
.fb{min-height:10px;margin:14px 0 0;border-radius:18px;font-size:20px;text-align:center}
.fb.good{background:var(--green-bg);border:3px solid #9fe3c1;padding:12px 16px}
.fb.try{background:var(--try-bg);border:3px solid #ffd0a1;padding:12px 16px}
.fb b{display:block;font-size:22px}

/* =========================================================
   PART 1
   ========================================================= */
.mag-wrap{position:relative}
.mag{position:absolute;right:-6%;top:-4%;width:46%;aspect-ratio:1;border-radius:50%;border:8px solid var(--primary);box-shadow:0 6px 16px rgba(0,0,0,.2);display:grid;place-items:center;animation:popIn .5s}
.mag::after{content:'';position:absolute;width:40%;height:12px;background:var(--primary);border-radius:6px;right:-34%;bottom:2%;transform:rotate(45deg)}
.mag-lens{position:absolute;inset:0;border-radius:50%}
.mag span{position:relative;background:#fff;border-radius:10px;padding:0 8px;font-weight:700;font-size:18px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.def{border-radius:24px;padding:16px;text-align:center}
.def.obj{background:#fff1e3;border:4px solid #ffc999}
.def.mat{background:#e3f9ee;border:4px solid #9fe3c1}
.def h3{font-size:30px;letter-spacing:1px}
.def.obj h3{color:#e0661a}.def.mat h3{color:#13804d}
.def .row{display:flex;justify-content:center;gap:10px;margin-top:8px}
.def .row .ico-s{width:60px;height:60px}
.eq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:22px;font-weight:600;margin:16px 0}
.eq .ico-s{width:80px;height:80px}
.flip{position:relative;width:100%;aspect-ratio:1/1.08;border:0;background:none;perspective:900px;padding:0}
.flip .in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .sa,.flip .sb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 #e6e2f7;border:4px solid var(--line);background:#fff;padding:8px}
.flip .sb{transform:rotateY(180deg);background:#effcf5;border-color:#9fe3c1}
.flip .ic-w{width:62%;aspect-ratio:1}
.flip b{font-size:21px}.flip small{font-size:14px;color:var(--muted)}
.counter{text-align:center;font-weight:600;color:var(--primary);margin:12px 0;font-size:20px}
.chair-big{width:min(300px,75vw);display:block;margin:0 auto}
.hot{cursor:pointer;outline:none}
.hot:not(.found){animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 10px #ffd23f)}}
.hot.found{filter:drop-shadow(0 0 4px #1fa968)}
.hot:focus-visible{filter:drop-shadow(0 0 6px var(--primary))}
.found-list{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.found-list li{display:flex;align-items:center;gap:10px;background:#f8f6ff;border-radius:16px;padding:8px 12px;font-size:20px;animation:popIn .4s}
.check-q{max-width:720px;margin:0 auto}
.qnum{text-align:center;color:var(--muted);font-weight:600}

/* =========================================================
   PART 2
   ========================================================= */
.mat-dash{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mat-btn{position:relative;border:4px solid var(--line);background:#fff;border-radius:26px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:22px;font-weight:700;box-shadow:0 6px 0 #e6e2f7;transition:transform .15s}
.mat-btn:hover{transform:translateY(-4px) rotate(-1deg)}
.mat-btn.seen{border-color:#9fe3c1;background:#f3fdf8}
.mat-btn .tick{position:absolute;top:8px;right:10px;background:var(--green);color:#fff;border-radius:50%;width:30px;height:30px;font-size:17px;display:grid;place-items:center}
.flasks{display:flex;justify-content:center;gap:8px;margin:14px 0;font-size:28px}
.flasks span{opacity:.25;filter:grayscale(1);transition:all .4s}
.flasks span.on{opacity:1;filter:none;transform:scale(1.15)}
.m-head{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.m-head h2{font-size:38px}
.m-sec{margin:14px 0}
.m-sec h3{font-size:20px;color:var(--primary);margin-bottom:6px}
.from{display:flex;align-items:center;gap:14px;background:#f8f6ff;border-radius:18px;padding:10px 14px}
.from .ico-s{width:70px;height:70px;flex:0 0 auto}
.ex-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.ex{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px;text-align:center;font-size:16px;font-weight:600}
.ex .ico-s{width:64px;height:64px;margin:0 auto 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff7d6;border:2px solid #ffe08a;border-radius:30px;padding:4px 14px;font-size:18px;font-weight:500}
.fact{background:linear-gradient(135deg,#fff7d6,#ffe9f3);border-radius:18px;padding:12px 16px;font-size:20px}
.nat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.nat .soft-card h3{margin-bottom:8px}
.nat .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nat .lab{display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:600}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin:0 auto}
.match .col{display:grid;gap:10px}
.mitem{border:4px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;min-height:72px;box-shadow:0 4px 0 #e6e2f7;text-align:left;touch-action:none}
.mitem .ico-s{width:52px;height:52px;flex:0 0 auto}
.mitem.sel{border-color:var(--primary);background:#efeaff;transform:scale(1.03)}
.mitem.done{border-color:#9fe3c1;background:#f3fdf8;cursor:default}
.mitem.done::after{content:'✓';margin-left:auto;color:var(--green);font-size:24px}
.mitem.drop-hover{border-color:var(--orange);background:#fff4ea}

/* =========================================================
   PART 3 – PROPERTIES & DEMOS
   ========================================================= */
.prop-hero{text-align:center;background:var(--c);color:#fff;border-radius:26px;padding:16px;margin-bottom:14px}
.prop-hero .pe{font-size:56px;display:block;line-height:1}
.prop-hero h2{font-size:clamp(34px,7vw,56px);letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.prop-hero .def{font-size:22px;margin-top:6px;background:rgba(255,255,255,.18);border-radius:16px;padding:8px 12px;display:inline-block}
.ex-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.ex-row .ex{width:116px}
.demo-box{background:#f8f6ff;border-radius:24px;padding:14px;margin:12px 0}
.predict{text-align:center;font-weight:600;font-size:20px;margin:0 0 10px}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dcell{position:relative;background:#fff;border-radius:18px;padding:40px 10px 10px;text-align:center;min-height:210px;overflow:hidden;border:3px solid var(--line)}
.dcell .obj{width:104px;height:104px;margin:0 auto;transform-origin:50% 100%;position:relative;z-index:2}
.dcell b{display:block;font-size:19px}
.dcell .res{font-size:17px;font-weight:600;color:var(--green);min-height:24px;margin:4px 0 0}

'use strict';
/* =========================================================

/* ---------- Sound effects (Web Audio, no files needed) ---------- */
let actx = null;
function tone(freqs, dur=0.12, type='sine', vol=0.16){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=t0+i*dur;
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.03);
    });
  }catch(e){}
}
const sfx = {
  good:()=>tone([660,880],0.11), bad:()=>tone([330,260],0.14,'triangle',0.12),
  win:()=>tone([523,659,784,1047],0.13), pop:()=>tone([520],0.07,'triangle',0.12), whoosh:()=>tone([300,500,700],0.06,'sine',0.08)

/* ---------- Read aloud (speech synthesis, optional) ---------- */
function speak(html){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const txt = String(html).replace(/<[^>]+>/g,' ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
    if(!txt) return;
    const u = new SpeechSynthesisUtterance(txt);
    u.rate = 0.9; u.pitch = 1.1; u.lang = 'en-GB';
    const v = speechSynthesis.getVoices().find(v => /en-GB/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Drag & drop that works with mouse AND touch ----------
   A short press without moving counts as a tap (click-to-select),
   so every drag activity also has a touch-friendly alternative. */
function makeDraggable(node, {dropSel, onDrop, onTap}){
  node.addEventListener('pointerdown', e => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(node.disabled || node.classList.contains('placed') || node.classList.contains('done')) return;
    const sx=e.clientX, sy=e.clientY, id=e.pointerId; let ghost=null, ox=0, oy=0;
    const move = ev => {
      if(ev.pointerId!==id) return;
      if(!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 10){
        const r=node.getBoundingClientRect(); ox=sx-r.left; oy=sy-r.top;
        ghost=node.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('sel');
        ghost.style.width=r.width+'px'; document.body.appendChild(ghost); node.classList.add('dragging');
      }
      if(ghost){
        ev.preventDefault();
        ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px';
        const t=document.elementFromPoint(ev.clientX, ev.clientY); const z=t && t.closest(dropSel);
        $$('.drop-hover').forEach(x => { if(x!==z) x.classList.remove('drop-hover'); });
        if(z) z.classList.add('drop-hover');
      }
    };
    const up = ev => {
      if(ev.pointerId!==id) return;
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      $$('.drop-hover').forEach(x => x.classList.remove('drop-hover'));
      if(ghost){
        ghost.remove(); node.classList.remove('dragging');
        if(ev.type==='pointerup'){ const t=document.elementFromPoint(ev.clientX, ev.clientY); const z=t && t.closest(dropSel); if(z) onDrop(z); }
      } else if(ev.type==='pointerup' && onTap) onTap();
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  node.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && onTap){ e.preventDefault(); onTap(); } });
}

/* Multiple-choice question for learning (retries allowed, answer never shown before trying again) */
function mcq(box, {q, opts, explain, hint, onCorrect, keepOrder}){
  const options = keepOrder ? opts : shuffle(opts);
  box.innerHTML = `<div class="mcq">${q?`<p class="q">${q}</p>`:''}<div class="opts">${options.map((o,i)=>`<button class="opt" data-i="${i}">${o.pic?`<span class="opt-pic">${pic(o.pic)}</span>`:''}<span>${o.t}</span></button>`).join('')}</div><div class="fb" aria-live="polite"></div></div>`;
  let tries=0, solved=false; const fb=$('.fb', box);
  $$('.opt', box).forEach(b => b.addEventListener('click', () => {
    if(solved) return;
    const o = options[+b.dataset.i]; tries++;
    if(o.ok){
      solved=true; b.classList.add('right'); $$('.opt', box).forEach(x => x.disabled=true);
      fb.className='fb good'; fb.innerHTML=`<b>${praise()} 🎉</b>${explain||''}`; sfx.good();
      if(tries===1) addStars(1, b);
      if(S.voice) speak(praise()+' '+(explain||''));
      if(onCorrect) onCorrect(tries===1);
    } else {
      b.classList.add('wrong'); b.disabled=true; sfx.bad();
      fb.className='fb try'; fb.innerHTML=`<b>Good try! Let's think again. 🤔</b>${o.why||hint||'Have another look and try again.'}`;
    }
  }));
}

{id:'p4-sort', ch:4, gate:true, tag:'Activity A', title:'Object or Material? Sorting game',

 render(b){

  let sel=null, placed=0, score=0;
  b.innerHTML = `<div class="tray">${items.map((x,i)=>`<button class="scard" data-i="${i}"><span class="ico-s">${pic(x.p)}</span>${x.t}</button>`).join('')}</div>
    <div class="zones"><div class="zone z-obj" data-z="obj" role="button" tabindex="0"><h3>📦 OBJECTS</h3><small>Things we use</small><div class="zl"></div></div>

  const fb=$('.fb',b);
  const armZones = on => $$('.zone',b).forEach(z=>z.classList.toggle('armed', on));

{id:'p4-mystery', ch:4, gate:true, badge:'mystery', tag:'Activity B', title:'The Mystery Feely Bag',
 say:"Oh no! Something is hiding inside my mystery bag. Listen to the clues. Can you guess what it is made from?",
 render(b){
  let qi=0, solved=0, stars=0;
  const show = () => {
    const M = MYSTERY[qi]; let shown=1, done=false; const opts = shuffle(M.opts);
    b.innerHTML = `<div class="mq-head"><span>Mystery ${qi+1} of ${MYSTERY.length}</span><span>Solved: ${solved} 🎒</span></div>
      <div class="mystery"><div class="bag-wrap"><div class="bag jiggle">${BAG}</div></div>
      <div><ul class="clues"></ul><div class="row-btns" style="justify-content:flex-start"><button class="btn ghost more">🔍 Another clue</button></div>
      <p class="q" style="text-align:left">What is it made from?</p>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-pic">${pic(o[1])}</span>${o[0]}</button>`).join('')}</div>
      <div class="fb"></div><div class="row-btns nx"></div></div></div>`;
    const clues=$('.clues',b), more=$('.more',b), fb=$('.fb',b);
    const drawClues = () => { clues.innerHTML = M.clues.slice(0,shown).map(c=>`<li>${c}</li>`).join(''); more.disabled = shown>=M.clues.length; if(S.voice) speak(M.clues[shown-1]); };
    drawClues();
    more.onclick = () => { if(shown<M.clues.length){ shown++; drawClues(); sfx.pop(); } };
    $$('.opt',b).forEach(btn => btn.onclick = () => {
      if(done) return; const o=opts[+btn.dataset.i];
      const right = o[0].toLowerCase().indexOf(M.ans.toLowerCase())===0;
      if(right){
        done=true; solved++; btn.classList.add('right'); $$('.opt',b).forEach(x=>x.disabled=true); sfx.win();
        const firstTry = !$('.opt.wrong',b); if(firstTry){ stars++; addStars(1,btn); }
        shown=M.clues.length; drawClues(); more.disabled=true;
        $('.bag-wrap',b).insertAdjacentHTML('beforeend', `<div class="reveal-obj">${ico(M.reveal)}</div>`);
        fb.className='fb good'; fb.innerHTML=`<b>${praise()} 🎉</b>${M.say}`;
        if(S.voice) speak(M.say);
        const nx=$('.nx',b);
        if(qi<MYSTERY.length-1){ nx.innerHTML='<button class="btn primary">Next mystery ▶</button>'; nx.firstChild.onclick=()=>{qi++; show();}; }
        else { nx.innerHTML=`<p class="big-say pop-in">You solved all ${MYSTERY.length} mysteries! 🕵️</p>`; confetti(50); complete('p4-mystery'); }
      } else {
        btn.classList.add('wrong'); btn.disabled=true; sfx.bad();
        fb.className='fb try';
        if(shown<M.clues.length){ shown++; drawClues(); fb.innerHTML='<b>Not quite! 🤔</b>Here is another clue to help you…'; }
        else fb.innerHTML='<b>Not quite! 🤔</b>Read all the clues again carefully.';
      }
    });
  };
  show();
 },

{id:'p4-match', ch:4, gate:true, tag:'Activity D', title:'Property Detective: match the clues',
 say:"Match each object with a property! Tap an object, then tap a property card. Some objects have more than one property!",
 render(b){
  let selObj=null, selProp=null, doneN=0; const got = PMATCH.map(()=>new Set());

    <div class="fb"></div><p class="counter">Matched: <b class="n">0</b> / ${PMATCH.length}</p>`;
  const fb=$('.fb',b);

    const i=+objEl.dataset.i, o=PMATCH[i], label=PCARDS.find(p=>p[0]===prop)[1];
    $$('.pcard',b).forEach(x=>x.classList.remove('sel')); $$('.pobj',b).forEach(x=>x.classList.remove('sel')); selObj=null; selProp=null;
    if(got[i].has(prop)){ toast(`You already matched ${label}! Try another property.`); return; }
    if(o.ok.includes(prop)){
      const first = got[i].size===0; got[i].add(prop);
      $('.got',objEl).insertAdjacentHTML('beforeend', `<span>${label}</span>`); objEl.classList.add('done'); sfx.good();
      if(first){ doneN++; addStars(1,objEl); $('.n',b).textContent=doneN; }
      fb.className='fb good'; fb.innerHTML=`<b>${praise()}</b>A ${o.t.toLowerCase()} is <b>${label.toLowerCase()}</b>.${first&&o.ok.length>1?' Can you find another property for it too?':''}`;
      if(doneN===PMATCH.length && first){ fb.innerHTML+='<br>🎉 Every object matched!'; complete('p4-match'); }

      fb.className='fb try'; fb.innerHTML=`<b>Hmm, not that one! 🤔</b>${o.hint}`;

  };
  $$('.pcard',b).forEach(c => makeDraggable(c, {dropSel:'.pobj', onDrop:z=>tryMatch(z, c.dataset.p),
    onTap:()=>{ if(selObj){ tryMatch(selObj, c.dataset.p); return; } $$('.pcard',b).forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); selProp=c.dataset.p; sfx.pop(); }}));
  $$('.pobj',b).forEach(o => o.addEventListener('click', () => { if(selProp){ tryMatch(o, selProp); return; } $$('.pobj',b).forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); selObj=o; sfx.pop(); }));

/* ---------- Material Explorer modal ---------- */
function openMat(m, onClose){
  const M = MATS[m];
  if(!S.explored.includes(m)){ S.explored.push(m); save(); addStars(1); }
  const modal = openModal(`<div class="m-head">${matChar(m,'lg')}<div><h2>${M.name}</h2><span class="pill soft">Material ${MAT_ORDER.indexOf(m)+1} of 6</span></div></div>
    <div class="m-sec"><h3>🌍 Where does it come from?</h3><div class="from"><span class="ico-s">${ico(M.fromIc)}</span><p>${M.from}</p></div></div>
    <div class="m-sec"><h3>👀 Look! Things made from ${M.name.toLowerCase()}:</h3><div class="ex-grid">${M.ex.map(e=>`<div class="ex">${icoS(e[0])}${e[1]}</div>`).join('')}</div></div>
    <div class="m-sec"><h3>🕵️ What is it like?</h3><div class="chips">${M.props.map(p=>`<span class="chip">${p}</span>`).join('')}</div></div>
    <div class="m-sec"><h3>🛠️ What is it used for?</h3><p>${M.uses}</p></div>
    ${M.demo?`<div class="m-sec"><h3>🧪 Try it!</h3><div class="mdemo"></div></div>`:''}
    ${M.safety?`<div class="safety">⚠️ ${M.safety}</div>`:''}
    <div class="m-sec fact">⭐ <b>Fun fact:</b> ${M.fact}</div>
    <div class="m-sec soft-card"><b>🔍 Little Scientist question:</b> ${M.ask}<div class="row-btns" style="justify-content:flex-start;margin:8px 0 0"><button class="btn green yes">Yes! 🙋</button><button class="btn ghost no">Not yet</button></div><p class="ans"></p></div>
    <div class="row-btns"><button class="btn primary big" data-close>Got it! ✓</button></div>`, onClose);
  $('.yes',modal).onclick = () => { $('.ans',modal).textContent='Brilliant exploring! 🌟'; sfx.good(); };
  $('.no',modal).onclick = () => { $('.ans',modal).textContent="That's OK! Have a look around later. 🔍"; };
  if(M.demo==='screen') DEMOS.screen($('.mdemo',modal), {panels:[{kind:'glass',label:'the glass window',see:true}]}, ()=>{});

}

/* ---------- Quiz engine ---------- */
function renderQuiz(b){
  if(!S.quiz || !Array.isArray(S.quiz.answers)) { S.quiz = {i:0, answers:[], finished:false}; save(); }
  const q = S.quiz;
  if(q.finished) return renderResults(b);
  const i = Math.min(q.i, QUIZ.length-1), Q = QUIZ[i];
  const opts = Q.keep ? Q.opts : shuffle(Q.opts);
  const score = q.answers.filter(a=>a.ok).length;
  b.innerHTML = `<div class="quiz"><div class="qbar"><span>Question ${i+1} of ${QUIZ.length}</span><span>⭐ ${score} correct</span></div>
    <div class="qprog"><i style="width:${i/QUIZ.length*100}%"></i></div>
    <span class="pill soft">${Q.type}</span>
    ${Q.pic?`<div class="hero-pic sm" style="display:grid;place-items:center">${Q.pic.indexOf('mat:')===0?matChar(Q.pic.slice(4),'lg'):ico(Q.pic)}</div>`:''}
    <h2 class="qq">${Q.q}</h2>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.pic?`<span class="opt-pic">${pic(o.pic)}</span>`:''}<span>${o.t}</span></button>`).join('')}</div>
    <div class="fb"></div><div class="row-btns nx"></div></div>`;
  if(S.voice) speak(Q.q);
  $$('.opt',b).forEach(btn => btn.onclick = () => {
    const o = opts[+btn.dataset.k], ok = !!o.ok;
    $$('.opt',b).forEach(x=>x.disabled=true);
    q.answers = q.answers.filter(a=>a.qi!==i); q.answers.push({qi:i, ok});
    const fb=$('.fb',b);
    if(ok){ btn.classList.add('right'); sfx.good(); addStars(1,btn); fb.className='fb good'; fb.innerHTML=`<b>${praise()} 🎉</b>${Q.why}`; }
    else { btn.classList.add('wrong'); sfx.bad(); $$('.opt',b).forEach((x,k)=>{ if(opts[k].ok) x.classList.add('right'); });
      fb.className='fb try'; fb.innerHTML=`<b>Good try! The answer is: ${opts.find(x=>x.ok).t}</b>${Q.why}`; }
    if(S.voice) speak(Q.why);
    const last = i===QUIZ.length-1;
    q.i = i+1; if(last) q.finished = true; save();
    const nx=$('.nx',b); nx.innerHTML = `<button class="btn primary big">${last?'See my results 🏆':'Next question ▶'}</button>`;
    nx.firstChild.onclick = () => { if(last){ giveBadge('star'); complete('p5-quiz'); } renderQuiz(b); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}
function renderResults(b){
  const q=S.quiz, total=QUIZ.length, right=q.answers.filter(a=>a.ok).length, wrong=total-right, pct=Math.round(right/total*100);
  const [icon, level, msg] = quizLevel(pct);
  const mistakes = q.answers.filter(a=>!a.ok).map(a=>a.qi);
  b.innerHTML = `<div class="results"><div class="trophy">${icon}</div><p class="level">${level}</p><p style="font-size:22px">${msg}</p>
    <div class="res-grid"><div><b>${total}</b>Questions</div><div><b style="color:var(--green)">${right}</b>Correct</div><div><b style="color:var(--try)">${wrong}</b>To practise</div><div><b>${pct}%</b>Score</div></div>
    <div class="row-btns">${mistakes.length?'<button class="btn orange big rv">🔁 Review my mistakes</button>':'<p class="big-say">No mistakes at all! 🌟</p>'}<button class="btn ghost again">Try the whole quiz again</button></div>
    <div class="review"></div></div>`;
  if(pct>=70) confetti(70);
  complete('p5-quiz'); if(!S.badges.includes('star')) giveBadge('star');
  const rv=$('.rv',b);
  if(rv) rv.onclick = () => reviewMistakes($('.review',b), mistakes);
  $('.again',b).onclick = () => { S.quiz={i:0,answers:[],finished:false}; save(); renderQuiz(b); };
}
function reviewMistakes(box, list){
  let k=0;
  const show = () => {
    if(k>=list.length){ box.innerHTML = `<p class="big-say pop-in">You practised them all! Well done! 🌟</p>`; sfx.win(); return; }
    const Q = QUIZ[list[k]];
    box.innerHTML = `<div class="card" style="margin-top:14px"><p class="qnum">Practice ${k+1} of ${list.length}</p>${Q.pic?`<div class="hero-pic sm" style="display:grid;place-items:center">${Q.pic.indexOf('mat:')===0?matChar(Q.pic.slice(4),'lg'):ico(Q.pic)}</div>`:''}<div class="qb"></div><div class="row-btns nx"></div></div>`;
    mcq($('.qb',box), {q:Q.q, keepOrder:Q.keep, opts:Q.opts.map(o=>({t:o.t,pic:o.pic,ok:!!o.ok})), explain:Q.why, hint:'Think about what we learned. You can do it!',
      onCorrect(){ const nx=$('.nx',box); nx.innerHTML='<button class="btn primary">Next ▶</button>'; nx.firstChild.onclick=()=>{k++; show();}; }});
    box.scrollIntoView({behavior:'smooth', block:'start'});
  };
  show();
}

/* =========================================================
   10. ENGINE – rendering, navigation, progress
   ========================================================= */
const stage = $('#stage');
if(S.step<0 || S.step>=STEPS.length) S.step=0;
if(S.max<S.step) S.max=S.step;
if(S.max>=STEPS.length) S.max=STEPS.length-1;

function render(){
  const st = STEPS[S.step], ch = CHAPTERS[st.ch];
  if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
  closeModal();
  stage.innerHTML = `<section class="step">
    ${st.ch>0?`<div class="step-top"><span class="pill" style="--c:${ch.color}">${ch.icon} ${ch.name}</span>${st.tag?`<span class="pill soft">${st.tag}</span>`:''}</div>`:''}
    ${st.title?`<h1 class="title" tabindex="-1">${st.title}</h1>`:''}
    ${st.say?`<div class="guide"><div class="g-mascot">${MASCOT}</div><div class="bubble"><p>${st.say}</p><button class="read" aria-label="Read aloud" title="Read aloud">🔊</button></div></div>`:''}
    <div class="body"></div>
    ${st.teach?teachHTML(st.teach):''}
  </section>`;
  const rd = $('.read', stage); if(rd) rd.onclick = () => speak(st.say);
  if(!st.gate && !S.done[st.id]){ S.done[st.id]=true; save(); }
  try { st.render($('.body', stage), st); }
  catch(err){ console.error(err); $('.body',stage).innerHTML = '<p class="note">Oops! Something went wrong on this page. Please press Next or Back.</p>'; S.done[st.id]=true; }
  updateNav(); updateHud();
  window.scrollTo(0,0);
  const t=$('.title',stage); if(t) t.focus({preventScroll:true});
  if(S.voice && st.say) setTimeout(()=>speak(st.say), 300);
}
function complete(id){
  const st = STEPS.find(s=>s.id===id);
  if(S.done[id]){ updateNav(); return; }
  S.done[id]=true; save(); updateNav();
  if(st && st.badge) setTimeout(()=>giveBadge(st.badge), 900);
  const nb=$('#next'); nb.classList.remove('pulse'); void nb.offsetWidth; nb.classList.add('pulse');
}
function canNext(){ const st=STEPS[S.step]; return !st.gate || !!S.done[st.id]; }
function next(){
  if(S.step>=STEPS.length-1) return;
  if(!canNext()){ toast('Finish the activity on this page first, Little Scientist! 🔒'); const n=$('#next'); n.classList.add('shake'); setTimeout(()=>n.classList.remove('shake'),500); return; }
  S.step++; if(S.step>S.max) S.max=S.step; save(); sfx.whoosh(); render();
}
function prev(){ if(S.step>0){ S.step--; save(); render(); } }
function goTo(i){ if(i>=0 && i<=S.max && i<STEPS.length){ S.step=i; save(); render(); } }
function updateNav(){
  const st=STEPS[S.step], ok=canNext(), last=S.step===STEPS.length-1;
  const pb=$('#prev'), nb=$('#next');
  pb.disabled = S.step===0;
  nb.style.visibility = last ? 'hidden' : 'visible';
  nb.classList.toggle('locked', !ok);
  nb.setAttribute('aria-disabled', String(!ok));
  nb.innerHTML = ok ? (S.step===0 ? 'Start ▶' : 'Next ▶') : '🔒 Next';
  $('#dots').innerHTML = CHAPTERS.map((c,i)=>{
    const first=STEPS.findIndex(s=>s.ch===i), steps=STEPS.filter(s=>s.ch===i);
    const done = steps.every(s=>S.done[s.id]);
    return `<button class="dot ${st.ch===i?'cur':''} ${done&&st.ch!==i?'done':''}" data-to="${first}" ${first<=S.max?'':'disabled'} title="${c.short}" aria-label="${c.name}">${c.icon}</button>`;
  }).join('');
  $$('#dots .dot').forEach(d => d.onclick = () => goTo(+d.dataset.to));
  const pct = S.step/(STEPS.length-1)*100;
  $('#progFill').style.width = pct+'%'; $('#progRocket').style.left = Math.max(2, Math.min(98, pct))+'%';
  $('#progText').textContent = `${CHAPTERS[st.ch].name} · Step ${S.step+1} of ${STEPS.length}`;
}
function updateHud(){
  $('#starNum').textContent=S.stars; $('#badgeNum').textContent=S.badges.length;
  $('#soundBtn').setAttribute('aria-pressed', String(S.sound)); $('#soundBtn').textContent = S.sound?'🔊':'🔇';
  $('#voiceBtn').setAttribute('aria-pressed', String(S.voice));
}
function askRestart(){
  const m = openModal(`<div class="center"><div style="font-size:60px">🔄</div><h2>Start the whole adventure again?</h2><p>Your stars, badges and answers will be cleared.</p>
    <div class="row-btns"><button class="btn orange big yes">Yes, start again</button><button class="btn ghost big" data-close>No, keep going</button></div></div>`);
  $('.yes',m).onclick = () => { const keep={sound:S.sound, voice:S.voice}; S=Object.assign(fresh(), keep); save(); closeModal(); render(); toast('A brand new adventure! 🚀'); };
}

/* ---------- Top bar + keyboard ---------- */
$('#brandM').innerHTML = MASCOT;
$('#prev').onclick = prev;
$('#next').onclick = next;
$('#soundBtn').onclick = () => { S.sound=!S.sound; save(); updateHud(); if(S.sound) sfx.pop(); };
$('#voiceBtn').onclick = () => { S.voice=!S.voice; save(); updateHud(); toast(S.voice?'I will read every page aloud 🗣️':'Reading aloud is off'); if(S.voice){ const st=STEPS[S.step]; speak(st.say||'Welcome to the Everyday Materials Science Adventure!'); } else try{speechSynthesis.cancel();}catch(e){} };
$('#restartBtn').onclick = askRestart;
$('#starsBtn').onclick = () => toast(`You have collected ${S.stars} stars! ⭐ Keep going!`);
$('#badgeBtn').onclick = () => openModal(`<h2 class="center" style="color:var(--primary)">🏅 My Badges</h2><p class="center">You have ${S.badges.length} of ${Object.keys(BADGES).length} badges.</p><div class="shelf">${Object.keys(BADGES).map(k=>badgeHTML(k, !S.badges.includes(k))).join('')}</div><div class="row-btns"><button class="btn primary" data-close>Close</button></div>`);
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ const o=$('#overlay'); if(o && o._close) o._close(); return; }
  if($('#overlay')) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev();
});
if('speechSynthesis' in window) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }catch(e){}

render();
</script>
</body>
</html>
